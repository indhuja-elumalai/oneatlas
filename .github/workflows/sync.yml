# Keeps OneAtlas data fresh: re-runs the ingestion pipeline every 6 hours.
# Add DATABASE_URL and DIRECT_URL as repository secrets (Settings -> Secrets -> Actions).
name: Sync model data
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
